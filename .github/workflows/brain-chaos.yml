name: brain-chaos

# sofuu/brain/tests/chaos.sh is the W7.6 chaos/durability matrix: 15 random
# SIGKILLs during ingest, 20 manifest mutations + 10 segment mutations, a
# four-way writer stampede and a disk-full path. It is STOCHASTIC -- the kills
# land at random offsets (bash $RANDOM) and the fuzzer picks random bit flips
# (python random) -- so one pull_request run only exercises the one
# interleaving it happened to draw. The cron entry re-runs it every day to
# catch the rare one; workflow_dispatch is there for a manual re-roll when a
# failure needs to be reproduced or ruled out as a flake.
on:
  pull_request:
    paths:
      - 'sofuu/brain/**'
      - 'include/qtsq.h'
      - 'crypto/**'
      - 'Makefile'
      # Editing this workflow must exercise it, otherwise a broken edit is only
      # discovered on the next brain change.
      - '.github/workflows/brain-chaos.yml'
  push:
    branches: [ master ]
    paths:
      - 'sofuu/brain/**'
      - 'include/qtsq.h'
      - 'crypto/**'
      - 'Makefile'
      - '.github/workflows/brain-chaos.yml'
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: GitHub queues the :00 cron
    # spike and delays those runs by tens of minutes.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-chaos:
    name: brain-chaos
    runs-on: ubuntu-24.04
    # The suite itself takes ~45 s; the budget is for the cold build of
    # libqtsq.a (~106 translation units) plus a stuck child from the SIGKILL
    # matrix, which must fail the job instead of parking a runner for hours.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Beyond build-essential:
      #   gobjc++      -- the ROOT Makefile compiles src/*.mm on every platform
      #                   (`-x objective-c++`), not just on Darwin; ubuntu's
      #                   `cc` is gcc, and gcc's Objective-C++ frontend
      #                   (cc1objplus) ships in gobjc++, not in build-essential.
      #   zlib1g-dev   -- the brain module links libqtsq.a with `-lz`.
      #   python3      -- chaos.sh's corruption fuzzer (mkcorrupt) is python3;
      #                   it is on the runner image already, pinned here so the
      #                   suite cannot silently skip its fuzz stages.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gobjc++ zlib1g-dev python3

      # Report what the runner's toolchain can actually do, and fall back to
      # clang (preinstalled on the image) if gcc cannot compile Objective-C++.
      # The root Makefile hard-codes `CC = cc`, and a makefile assignment beats
      # the environment, so the fallback has to reach make as a command-line
      # assignment -- that is what MAKE_CC_ARG carries.
      - name: Toolchain check (Objective-C++ frontend, python3)
        run: |
          echo "uname -s -> $(uname -s)"
          cc --version | head -1
          echo 'int main(void){return 0;}' > "$RUNNER_TEMP/probe.mm"
          if cc -x objective-c++ -c "$RUNNER_TEMP/probe.mm" -o "$RUNNER_TEMP/probe.o" 2>/dev/null; then
            echo "cc can compile Objective-C++ (src/qtsq_metal.mm will build as an empty TU: its body is #ifdef __APPLE__)"
            echo "MAKE_CC_ARG=" >> "$GITHUB_ENV"
          else
            echo "::warning::cc has no Objective-C++ frontend; building with clang instead"
            echo "MAKE_CC_ARG=CC=clang" >> "$GITHUB_ENV"
          fi
          command -v python3 && python3 --version

      # sofuu/brain links libqtsq.a via -L../.., so the root archive has to
      # exist first. `lib` is the archive-only target (no cli/viewer/apps).
      - name: Build root library (libqtsq.a)
        run: make lib ${MAKE_CC_ARG}

      # Linux reality check, done once by hand on 2026-10-30 by cross-compiling
      # this module with `zig cc -target x86_64-linux-gnu` (real glibc headers):
      # all 12 module TUs and tests/chaos_worker.c compile clean for
      # x86_64-linux-gnu. The one Linux trap in this tree is not in the Makefile
      # but in <sys/file.h>: sfb_ops.c calls flock(), which macOS declares
      # transitively through <sys/fcntl.h> and glibc only through <sys/file.h>.
      - name: Build brain module + chaos worker
        run: make -C sofuu/brain all tests/chaos_worker ${MAKE_CC_ARG}

      # chaos.sh prints its work dir on the second-to-last line
      # ("artifacts: /tmp/sfb_chaos.XXXXXX") and asserts the verdict with its
      # last statement `[ "$FAIL" -eq 0 ]`. pipefail keeps that exit status
      # through tee, so the step outcome is the suite's own verdict.
      - name: Run chaos suite
        working-directory: sofuu/brain
        run: |
          set -o pipefail
          BIN=./sfb WORKER=./tests/chaos_worker bash tests/chaos.sh 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/chaos.log"

      - name: Upload chaos work dir
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brain-chaos-workdir-ubuntu-24.04
          # mktemp -d /tmp/sfb_chaos.XXXXXX in chaos.sh -- the killed brains,
          # the fuzzed copies and the per-stage logs live under it.
          path: /tmp/sfb_chaos.*
          if-no-files-found: warn
          retention-days: 7

  # The module targets macOS as well; the same suite must hold there. The root
  # library is a cold ~36 s build on an M-series Mac, the brain module ~4 s and
  # the suite ~45 s, so this fits comfortably in the same 20 minute budget.
  brain-chaos-macos:
    name: brain-chaos-macos-14
    # Skipped on the nightly cron: the same suite already runs on
    # ubuntu there, and a macOS lane costs 10x the minutes.
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No dependency step: the macOS runner image already has clang, make,
      # the Command Line Tools SDK (zlib) and python3. -framework
      # CoreFoundation/Security and -lc++ come from the brain Makefile's
      # Darwin branch. opus is not installed there, so the root Makefile drops
      # src/qtsq_audio_opus.c via its pkg-config probe.
      - name: Build root library (libqtsq.a)
        run: make lib

      - name: Build brain module + chaos worker
        run: make -C sofuu/brain all tests/chaos_worker

      - name: Run chaos suite
        working-directory: sofuu/brain
        run: |
          set -o pipefail
          BIN=./sfb WORKER=./tests/chaos_worker bash tests/chaos.sh 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/chaos.log"

      - name: Upload chaos work dir
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brain-chaos-workdir-macos-14
          path: /tmp/sfb_chaos.*
          if-no-files-found: warn
          retention-days: 7
